server.port=8080
server.servlet.context-path=/api

spring.application.name=devflow-backend

# Local MongoDB Connection (Connected to MongoDB Compass on localhost:27017)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/devflow_db}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Data Seeding (Set to false for real-world production)
app.seed.enabled=${APP_SEED_ENABLED:false}

# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.com.devflow=DEBUG
